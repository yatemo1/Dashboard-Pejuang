name: Update Dashboard Data

# Membuat dashboard "dinamis": data ditarik ulang dari Google Sheet secara
# terjadwal, disamarkan, lalu di-commit -> GitHub Pages otomatis redeploy.
on:
  schedule:
    - cron: "0 22 * * *"   # setiap hari jam 06:00 WITA (22:00 UTC hari sebelumnya)
  workflow_dispatch: {}     # tombol "Run workflow" manual di tab Actions
  push:
    branches: [main]
    paths:
      - "scripts/**"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch & anonymize data from Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scripts/fetch_data.py

      - name: Commit updated data.json (jika ada perubahan)
        run: |
          git config user.name "pejuang-dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/data.json
          git diff --cached --quiet || git commit -m "chore: auto-update dashboard data "
          git push
